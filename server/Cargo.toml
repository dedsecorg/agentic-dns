[package]
name = "agentic-dns-server"
version = "1.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4", features = ["derive"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2.0"
