name: Bug report
description: Report a reproducible problem with agentic-dns.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Include commands, configuration, and relevant logs. Remove secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.5.0"
    validations:
      required: true
