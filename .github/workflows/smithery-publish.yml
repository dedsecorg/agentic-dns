# Publishes the smithery.yaml MCP manifest to the Smithery registry
# whenever a new GitHub Release is created. Requires SMITHERY_API_KEY
# as a repository secret (smithery.ai -> account settings -> API keys).
name: Publish to Smithery

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish to Smithery
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          npx @smithery/cli mcp publish "https://github.com/${{ github.repository }}" \
            -n dedsecorg/${{ github.event.repository.name }} --json
